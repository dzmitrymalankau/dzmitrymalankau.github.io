<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#grad1)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="70" fill="white" opacity="0.1"/>
  <circle cx="850" cy="350" r="90" fill="white" opacity="0.1"/>
  
  <!-- CI/CD Pipeline visualization -->
  <!-- Stage 1: Code -->
  <g>
    <rect x="100" y="200" width="80" height="80" fill="white" opacity="0.9" rx="6"/>
    <text x="140" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#14b8a6" text-anchor="middle">Code</text>
    <text x="140" y="245" font-family="Arial" font-size="11" fill="#0f766e" text-anchor="middle">Commit</text>
    <circle cx="140" cy="265" r="4" fill="#14b8a6"/>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 190 240 L 240 240" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.8"/>
  
  <!-- Stage 2: Build -->
  <g>
    <rect x="250" y="200" width="80" height="80" fill="white" opacity="0.9" rx="6"/>
    <text x="290" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#14b8a6" text-anchor="middle">Build</text>
    <text x="290" y="245" font-family="Arial" font-size="11" fill="#0f766e" text-anchor="middle">Test</text>
    <circle cx="290" cy="265" r="4" fill="#14b8a6"/>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 340 240 L 390 240" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.8"/>
  
  <!-- Stage 3: Deploy -->
  <g>
    <rect x="400" y="200" width="80" height="80" fill="white" opacity="0.9" rx="6"/>
    <text x="440" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#14b8a6" text-anchor="middle">Deploy</text>
    <text x="440" y="245" font-family="Arial" font-size="11" fill="#0f766e" text-anchor="middle">Staging</text>
    <circle cx="440" cy="265" r="4" fill="#14b8a6"/>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 490 240 L 540 240" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.8"/>
  
  <!-- Stage 4: Production -->
  <g>
    <rect x="550" y="200" width="80" height="80" fill="#ffffff" rx="6" box-shadow="0 0 20px rgba(255,255,255,0.4)"/>
    <text x="590" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#14b8a6" text-anchor="middle">Prod</text>
    <text x="590" y="245" font-family="Arial" font-size="11" fill="#0f766e" text-anchor="middle">Live</text>
    <circle cx="590" cy="265" r="5" fill="#14b8a6"/>
  </g>
  
  <!-- Monitoring boxes -->
  <g opacity="0.6">
    <rect x="750" y="150" width="120" height="60" fill="white" opacity="0.7" rx="4"/>
    <text x="810" y="172" font-family="Arial" font-size="12" fill="#0f766e" text-anchor="middle">Monitoring</text>
    <text x="810" y="190" font-family="Arial" font-size="10" fill="#14b8a6" text-anchor="middle">Performance</text>
  </g>
  
  <g opacity="0.6">
    <rect x="750" y="250" width="120" height="60" fill="white" opacity="0.7" rx="4"/>
    <text x="810" y="272" font-family="Arial" font-size="12" fill="#0f766e" text-anchor="middle">Logging</text>
    <text x="810" y="290" font-family="Arial" font-size="10" fill="#14b8a6" text-anchor="middle">Analytics</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="510" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" opacity="0.95" text-anchor="middle">
    CI/CD Pipeline Automation
  </text>
</svg>
