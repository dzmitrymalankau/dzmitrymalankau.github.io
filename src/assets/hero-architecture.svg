<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="archGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#6c5ce7;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#5f27cd;stop-opacity:1"></stop>
    </linearGradient>
    <linearGradient id="archGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:0.2"></stop>
      <stop offset="100%" style="stop-color:#5f27cd;stop-opacity:0.2"></stop>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#archGrad1)"></rect>
  <rect width="1020" height="510" fill="url(#archGrad2)"></rect>
  
  <!-- Architecture layers -->
  <g transform="translate(510, 255)">
    <!-- Client layer -->
    <rect x="-150" y="-180" width="300" height="50" fill="white" opacity="0.9" rx="6"></rect>
    <text x="0" y="-155" font-family="sans-serif" font-size="14" fill="#5f27cd" text-anchor="middle" font-weight="bold">Client Layer</text>
    
    <!-- API layer -->
    <rect x="-150" y="-90" width="300" height="50" fill="white" opacity="0.85" rx="6"></rect>
    <text x="0" y="-65" font-family="sans-serif" font-size="14" fill="#5f27cd" text-anchor="middle" font-weight="bold">API Gateway</text>
    
    <!-- Service layer -->
    <rect x="-150" y="0" width="120" height="50" fill="white" opacity="0.8" rx="6"></rect>
    <text x="-90" y="25" font-family="sans-serif" font-size="12" fill="#5f27cd" text-anchor="middle" font-weight="bold">Service A</text>
    
    <rect x="30" y="0" width="120" height="50" fill="white" opacity="0.8" rx="6"></rect>
    <text x="90" y="25" font-family="sans-serif" font-size="12" fill="#5f27cd" text-anchor="middle" font-weight="bold">Service B</text>
    
    <!-- Data layer -->
    <rect x="-150" y="90" width="300" height="50" fill="white" opacity="0.75" rx="6"></rect>
    <text x="0" y="115" font-family="sans-serif" font-size="14" fill="#5f27cd" text-anchor="middle" font-weight="bold">Data Storage</text>
    
    <!-- Connectors -->
    <line x1="0" y1="-130" x2="0" y2="-90" stroke="white" stroke-width="2" opacity="0.6"></line>
    <line x1="-60" y1="-40" x2="-90" y2="0" stroke="white" stroke-width="2" opacity="0.6"></line>
    <line x1="60" y1="-40" x2="90" y2="0" stroke="white" stroke-width="2" opacity="0.6"></line>
    <line x1="-60" y1="50" x2="-60" y2="90" stroke="white" stroke-width="2" opacity="0.6"></line>
    <line x1="60" y1="50" x2="60" y2="90" stroke="white" stroke-width="2" opacity="0.6"></line>
  </g>
  
  <!-- Decorative communication lines -->
  <g opacity="0.15" stroke="white" stroke-width="1.5">
    <path d="M 100 150 Q 300 200 500 180"></path>
    <path d="M 900 300 Q 700 400 500 380"></path>
  </g>
</svg>