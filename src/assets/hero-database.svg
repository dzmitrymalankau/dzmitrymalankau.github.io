<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#grad1)"/>
  <rect width="1020" height="510" fill="url(#grad2)"/>
  
  <!-- Cylinder database shapes -->
  <!-- Database 1 (left) -->
  <g transform="translate(200, 150)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="white" opacity="0.8"/>
    <rect x="-50" y="0" width="100" height="120" fill="white" opacity="0.7"/>
    <ellipse cx="0" cy="120" rx="50" ry="20" fill="white" opacity="0.9"/>
    
    <!-- Stripes for data -->
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="45" x2="40" y2="45" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="70" x2="40" y2="70" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="95" x2="40" y2="95" stroke="#d97706" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Database 2 (center-top) -->
  <g transform="translate(510, 100)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="white" opacity="0.85"/>
    <rect x="-50" y="0" width="100" height="120" fill="white" opacity="0.75"/>
    <ellipse cx="0" cy="120" rx="50" ry="20" fill="white" opacity="0.95"/>
    
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="45" x2="40" y2="45" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="70" x2="40" y2="70" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="95" x2="40" y2="95" stroke="#d97706" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Database 3 (right) -->
  <g transform="translate(820, 150)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="white" opacity="0.8"/>
    <rect x="-50" y="0" width="100" height="120" fill="white" opacity="0.7"/>
    <ellipse cx="0" cy="120" rx="50" ry="20" fill="white" opacity="0.9"/>
    
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="45" x2="40" y2="45" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="70" x2="40" y2="70" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="95" x2="40" y2="95" stroke="#d97706" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Connection lines between databases -->
  <line x1="250" y1="220" x2="460" y2="220" stroke="white" stroke-width="2" opacity="0.5" stroke-dasharray="5,5"/>
  <line x1="560" y1="220" x2="770" y2="220" stroke="white" stroke-width="2" opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Performance metrics visualization -->
  <g opacity="0.8">
    <!-- Query speed indicator -->
    <circle cx="200" cy="370" r="45" fill="white" opacity="0.7"/>
    <text x="200" y="360" font-family="Arial" font-size="11" fill="#7c2d12" text-anchor="middle" font-weight="bold">Speed</text>
    <text x="200" y="385" font-family="Arial" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">↑ 10x</text>
  </g>
  
  <g opacity="0.8">
    <!-- Throughput indicator -->
    <circle cx="510" cy="370" r="45" fill="white" opacity="0.7"/>
    <text x="510" y="360" font-family="Arial" font-size="11" fill="#7c2d12" text-anchor="middle" font-weight="bold">Throughput</text>
    <text x="510" y="385" font-family="Arial" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">↑ 5x</text>
  </g>
  
  <g opacity="0.8">
    <!-- Resource utilization indicator -->
    <circle cx="820" cy="370" r="45" fill="white" opacity="0.7"/>
    <text x="820" y="360" font-family="Arial" font-size="11" fill="#7c2d12" text-anchor="middle" font-weight="bold">Resources</text>
    <text x="820" y="385" font-family="Arial" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">↓ 40%</text>
  </g>
  
  <!-- Title -->
  <text x="510" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" opacity="0.95" text-anchor="middle">
    Database Performance at Scale
  </text>
</svg>
