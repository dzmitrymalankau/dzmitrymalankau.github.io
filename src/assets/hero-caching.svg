<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cacheGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#00f2fe;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1"></stop>
    </linearGradient>
    <linearGradient id="cacheGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.2"></stop>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.2"></stop>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#cacheGrad1)"></rect>
  <rect width="1020" height="510" fill="url(#cacheGrad2)"></rect>
  
  <!-- Cache nodes -->
  <g transform="translate(510, 255)">
    <!-- Central cache -->
    <circle cx="0" cy="0" r="45" fill="white" opacity="0.95"></circle>
    <circle cx="0" cy="0" r="40" fill="#00d4ff" opacity="0.3"></circle>
    <text x="0" y="8" font-family="monospace" font-size="16" fill="#0066ff" text-anchor="middle" font-weight="bold">CACHE</text>
    
    <!-- Distributed nodes -->
    <g opacity="0.8">
      <!-- Top node -->
      <circle cx="0" cy="-120" r="35" fill="white"></circle>
      <circle cx="0" cy="-120" r="30" fill="#00f2fe" opacity="0.3"></circle>
      <text x="0" y="-113" font-family="monospace" font-size="12" fill="#0066ff" text-anchor="middle">Node 1</text>
      <line x1="0" y1="-75" x2="0" y2="-35" stroke="white" stroke-width="2" opacity="0.6"></line>
      
      <!-- Left node -->
      <circle cx="-110" cy="60" r="35" fill="white"></circle>
      <circle cx="-110" cy="60" r="30" fill="#00f2fe" opacity="0.3"></circle>
      <text x="-110" y="67" font-family="monospace" font-size="12" fill="#0066ff" text-anchor="middle">Node 2</text>
      <line x1="-60" y1="30" x2="-45" y2="15" stroke="white" stroke-width="2" opacity="0.6"></line>
      
      <!-- Right node -->
      <circle cx="110" cy="60" r="35" fill="white"></circle>
      <circle cx="110" cy="60" r="30" fill="#00f2fe" opacity="0.3"></circle>
      <text x="110" y="67" font-family="monospace" font-size="12" fill="#0066ff" text-anchor="middle">Node 3</text>
      <line x1="60" y1="30" x2="45" y2="15" stroke="white" stroke-width="2" opacity="0.6"></line>
    </g>
    
    <!-- Data flow indicators -->
    <g opacity="0.4" fill="white">
      <polygon points="0,-35 -8,-20 8,-20"></polygon>
      <polygon points="-45,15 -55,0 -40,-5"></polygon>
      <polygon points="45,15 55,0 40,-5"></polygon>
    </g>
  </g>
  
  <!-- Sync indicators -->
  <g opacity="0.3" stroke="white" stroke-width="2" fill="none">
    <circle cx="150" cy="150" r="30"></circle>
    <circle cx="870" cy="350" r="30"></circle>
    <circle cx="200" cy="420" r="25"></circle>
  </g>
</svg>