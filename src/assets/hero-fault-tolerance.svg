<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="faultGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa8231;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1"></stop>
    </linearGradient>
    <linearGradient id="faultGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fa8231;stop-opacity:0.2"></stop>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.2"></stop>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#faultGrad1)"></rect>
  <rect width="1020" height="510" fill="url(#faultGrad2)"></rect>
  
  <!-- Redundancy visualization -->
  <g transform="translate(510, 255)">
    <!-- Primary service -->
    <rect x="-100" y="-80" width="200" height="60" fill="white" opacity="0.95" rx="8"></rect>
    <text x="0" y="-50" font-family="sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">Primary Service</text>
    <text x="0" y="-32" font-family="monospace" font-size="12" fill="#f39c12" text-anchor="middle">Active</text>
    
    <!-- Replicas -->
    <g>
      <!-- Replica 1 -->
      <rect x="-200" y="40" width="170" height="50" fill="white" opacity="0.8" rx="6"></rect>
      <text x="-115" y="60" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">Replica 1</text>
      <text x="-115" y="75" font-family="monospace" font-size="11" fill="#95a5a6" text-anchor="middle">Standby</text>
      <line x1="-100" y1="-20" x2="-140" y2="40" stroke="white" stroke-width="2" opacity="0.5"></line>
      
      <!-- Replica 2 -->
      <rect x="30" y="40" width="170" height="50" fill="white" opacity="0.8" rx="6"></rect>
      <text x="115" y="60" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">Replica 2</text>
      <text x="115" y="75" font-family="monospace" font-size="11" fill="#95a5a6" text-anchor="middle">Standby</text>
      <line x1="100" y1="-20" x2="140" y2="40" stroke="white" stroke-width="2" opacity="0.5"></line>
    </g>
    
    <!-- Failover indicator -->
    <g opacity="0.4">
      <circle cx="0" cy="-80" r="8" fill="white"></circle>
      <text x="0" y="150" font-family="sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Fault Tolerance via Replication</text>
    </g>
  </g>
  
  <!-- Health check indicators -->
  <g opacity="0.3" stroke="white" stroke-width="1.5" fill="none">
    <circle cx="100" cy="100" r="20"></circle>
    <circle cx="920" cy="150" r="20"></circle>
    <circle cx="950" cy="400" r="20"></circle>
    <circle cx="50" cy="420" r="20"></circle>
  </g>
</svg>