<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#grad1)"/>
  
  <!-- Decorative pattern -->
  <rect width="1020" height="510" fill="url(#grad2)"/>
  
  <!-- Floating squares (representing blog posts/articles) -->
  <g opacity="0.15">
    <rect x="80" y="60" width="120" height="120" fill="white" rx="8" transform="rotate(-15 140 120)"/>
    <rect x="750" y="100" width="100" height="100" fill="white" rx="8" transform="rotate(20 800 150)"/>
    <rect x="150" y="320" width="90" height="90" fill="white" rx="8" transform="rotate(10 195 365)"/>
    <rect x="820" y="320" width="110" height="110" fill="white" rx="8" transform="rotate(-25 875 375)"/>
  </g>
  
  <!-- Central content blocks (stacked papers) -->
  <g transform="translate(510, 200)">
    <rect x="-80" y="0" width="160" height="100" fill="white" opacity="0.9" rx="6" box-shadow="0 10px 30px rgba(0,0,0,0.2)"/>
    <rect x="-75" y="-8" width="160" height="100" fill="white" opacity="0.7" rx="6"/>
    <rect x="-70" y="-16" width="160" height="100" fill="white" opacity="0.5" rx="6"/>
    
    <!-- Lines representing text -->
    <line x1="-60" y1="20" x2="60" y2="20" stroke="#6d28d9" stroke-width="2" opacity="0.4"/>
    <line x1="-60" y1="35" x2="50" y2="35" stroke="#6d28d9" stroke-width="1.5" opacity="0.3"/>
    <line x1="-60" y1="48" x2="45" y2="48" stroke="#6d28d9" stroke-width="1.5" opacity="0.3"/>
    <line x1="-60" y1="61" x2="55" y2="61" stroke="#6d28d9" stroke-width="1.5" opacity="0.3"/>
  </g>
  
  <!-- Pen/writing icon -->
  <g transform="translate(150, 380)">
    <path d="M 0 40 L -15 60 L -25 50 Z" fill="white" opacity="0.7"/>
    <path d="M 0 40 L 30 10 Q 35 5 40 10 L 10 40 Z" fill="white" opacity="0.8"/>
    <path d="M 30 10 L 50 -10" stroke="white" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  </g>
  
  <!-- Light bulb (ideas) -->
  <g transform="translate(850, 380)" opacity="0.7">
    <circle cx="0" cy="0" r="18" fill="white" opacity="0.8"/>
    <path d="M -12 18 L 12 18 M -15 22 L 15 22 M -18 26 L 18 26" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <rect x="-8" y="26" width="16" height="12" fill="white" rx="2"/>
  </g>
  
  <!-- Main title -->
  <text x="510" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" opacity="0.95" text-anchor="middle">
    Insights on Technology & Business
  </text>
</svg>
