<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#grad1)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="80" r="80" fill="url(#grad2)" opacity="0.15"/>
  <circle cx="900" cy="450" r="100" fill="url(#grad2)" opacity="0.15"/>
  
  <!-- Network nodes and connections -->
  <g stroke="white" stroke-width="2" opacity="0.3">
    <line x1="200" y1="150" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="600" y2="120"/>
    <line x1="600" y1="120" x2="800" y2="250"/>
    <line x1="400" y1="200" x2="500" y2="350"/>
    <line x1="500" y1="350" x2="700" y2="320"/>
  </g>
  
  <!-- Nodes (circles) -->
  <circle cx="200" cy="150" r="8" fill="white" opacity="0.6"/>
  <circle cx="400" cy="200" r="8" fill="white" opacity="0.8"/>
  <circle cx="600" cy="120" r="8" fill="white" opacity="0.7"/>
  <circle cx="800" cy="250" r="8" fill="white" opacity="0.6"/>
  <circle cx="500" cy="350" r="8" fill="white" opacity="0.7"/>
  <circle cx="700" cy="320" r="8" fill="white" opacity="0.6"/>
  
  <!-- Growth arrow -->
  <g transform="translate(300, 380)">
    <path d="M 0 80 L 0 20 L -15 35 M 0 20 L 15 35" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
  
  <!-- Ascending bars representing growth -->
  <g opacity="0.7">
    <rect x="150" y="400" width="30" height="60" fill="white" rx="4"/>
    <rect x="200" y="360" width="30" height="100" fill="white" rx="4"/>
    <rect x="250" y="320" width="30" height="140" fill="white" rx="4"/>
    <rect x="300" y="280" width="30" height="180" fill="white" rx="4"/>
  </g>
  
  <!-- Text label -->
  <text x="510" y="460" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">
    Building Scalable Systems
  </text>
</svg>
