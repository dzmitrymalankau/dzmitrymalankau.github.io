<svg viewBox="0 0 1020 510" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1020" height="510" fill="url(#grad1)"/>
  
  <!-- Decorative circles -->
  <circle cx="120" cy="120" r="70" fill="white" opacity="0.1"/>
  <circle cx="900" cy="380" r="80" fill="white" opacity="0.1"/>
  
  <!-- Left side: Markdown/Text -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="160" height="180" fill="white" opacity="0.9" rx="6"/>
    <text x="80" y="25" font-family="monospace" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold"># Markdown</text>
    
    <line x1="10" y1="35" x2="150" y2="35" stroke="#e9d5ff" stroke-width="1"/>
    
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#7c3aed">This is a paragraph</text>
    <text x="15" y="75" font-family="monospace" font-size="11" fill="#7c3aed">with **bold** text</text>
    
    <line x1="10" y1="85" x2="150" y2="85" stroke="#e9d5ff" stroke-width="1"/>
    
    <text x="15" y="105" font-family="monospace" font-size="10" fill="#9333ea">- List item 1</text>
    <text x="15" y="120" font-family="monospace" font-size="10" fill="#9333ea">- List item 2</text>
  </g>
  
  <!-- Arrows/plus signs -->
  <g opacity="0.7" fill="white">
    <text x="380" y="250" font-size="48" text-anchor="middle">+</text>
  </g>
  
  <!-- Right side: Interactive Components -->
  <g transform="translate(550, 150)">
    <rect x="0" y="0" width="160" height="180" fill="white" opacity="0.9" rx="6"/>
    <text x="80" y="25" font-family="monospace" font-size="13" fill="#a855f7" text-anchor="middle" font-weight="bold">&lt;Components&gt;</text>
    
    <line x1="10" y1="35" x2="150" y2="35" stroke="#e9d5ff" stroke-width="1"/>
    
    <!-- Interactive button example -->
    <rect x="20" y="50" width="120" height="30" fill="#a855f7" opacity="0.7" rx="4"/>
    <text x="80" y="72" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Click Me</text>
    
    <!-- Toggle switch example -->
    <circle cx="35" cy="105" r="8" fill="white" opacity="0.6"/>
    <line x1="30" y1="105" x2="50" y2="105" stroke="white" stroke-width="2" opacity="0.5"/>
    <circle cx="50" cy="105" r="3" fill="white" opacity="0.8"/>
    <text x="70" y="110" font-family="monospace" font-size="10" fill="#9333ea">Toggle</text>
    
    <!-- Slider example -->
    <line x1="20" y1="140" x2="140" y2="140" stroke="white" stroke-width="2" opacity="0.5"/>
    <circle cx="90" cy="140" r="5" fill="white" opacity="0.8"/>
    <text x="80" y="160" font-family="monospace" font-size="10" fill="#9333ea">Slider</text>
  </g>
  
  <!-- equals sign -->
  <g opacity="0.7" fill="white">
    <text x="380" y="440" font-size="40" text-anchor="middle">=</text>
  </g>
  
  <!-- Result/Output -->
  <g transform="translate(450, 350)">
    <rect x="0" y="0" width="200" height="110" fill="white" opacity="0.95" rx="6"/>
    <text x="100" y="25" font-family="Arial" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="bold">Live Interactive Content</text>
    
    <line x1="10" y1="35" x2="190" y2="35" stroke="#e9d5ff" stroke-width="1"/>
    
    <text x="20" y="60" font-family="Arial" font-size="12" fill="#9333ea">Dynamic Examples</text>
    <text x="20" y="80" font-family="Arial" font-size="12" fill="#9333ea">Real-time Updates</text>
    <text x="20" y="100" font-family="Arial" font-size="12" fill="#9333ea">User Interaction</text>
  </g>
  
  <!-- Title -->
  <text x="510" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" opacity="0.95" text-anchor="middle">
    MDX: Markdown Meets Components
  </text>
</svg>
