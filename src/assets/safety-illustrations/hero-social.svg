<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a1f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a1515;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient3)"/>
  
  <!-- Building/Restaurant -->
  <rect x="250" y="150" width="200" height="250" fill="#7c3a3a" stroke="#f87171" stroke-width="2"/>
  <circle cx="300" cy="200" r="15" fill="#fbbf24" opacity="0.7"/>
  <circle cx="350" cy="200" r="15" fill="#fbbf24" opacity="0.7"/>
  <circle cx="400" cy="200" r="15" fill="#fbbf24" opacity="0.7"/>
  <circle cx="300" cy="280" r="15" fill="#fbbf24" opacity="0.7"/>
  <circle cx="350" cy="280" r="15" fill="#fbbf24" opacity="0.7"/>
  <circle cx="400" cy="280" r="15" fill="#fbbf24" opacity="0.7"/>
  <rect x="320" y="330" width="60" height="70" fill="#8b4513" stroke="#f87171" stroke-width="2"/>
  
  <!-- Glass/Drink warning -->
  <g transform="translate(750, 250)">
    <path d="M 20 0 L 35 60 Q 35 70 25 70 Q 15 70 15 60 Z" fill="#fbbf24" opacity="0.6" stroke="#ef4444" stroke-width="3"/>
    <line x1="10" y1="15" x2="40" y2="15" stroke="#fbbf24" stroke-width="3"/>
    <!-- Warning X -->
    <line x1="25" y1="30" x2="40" y2="50" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="25" y2="50" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- People grouped safely -->
  <g transform="translate(500, 350)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24"/>
    <rect x="-10" y="12" width="20" height="30" fill="#fbbf24" opacity="0.8"/>
    
    <circle cx="40" cy="5" r="12" fill="#10b981"/>
    <rect x="30" y="17" width="20" height="30" fill="#10b981" opacity="0.8"/>
    
    <circle cx="-40" cy="5" r="12" fill="#10b981"/>
    <rect x="-50" y="17" width="20" height="30" fill="#10b981" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="580" font-size="36" font-weight="bold" text-anchor="middle" fill="#f87171">
    Social Venues
  </text>
  
  <text x="600" y="615" font-size="20" text-anchor="middle" fill="#d1d5db">
    Stay safe at restaurants, bars, and in crowds
  </text>
</svg>