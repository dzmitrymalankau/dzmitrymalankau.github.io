<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Shield background -->
  <path d="M 600 100 L 750 150 L 750 350 Q 750 450 600 530 Q 450 450 450 350 L 450 150 Z" 
        fill="#4ade80" opacity="0.15" stroke="#4ade80" stroke-width="2"/>
  
  <!-- Main shield -->
  <path d="M 600 120 L 740 170 L 740 350 Q 740 440 600 520 Q 460 440 460 350 L 460 170 Z" 
        fill="none" stroke="#4ade80" stroke-width="3"/>
  
  <!-- Checkmark inside shield -->
  <g transform="translate(600, 300)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.3"/>
    <path d="M -20 0 L 15 35 L 45 -15" 
          fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Left icon - Lock -->
  <g transform="translate(200, 250)">
    <rect x="0" y="20" width="60" height="80" rx="4" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M 15 20 Q 15 0 30 0 Q 45 0 45 20" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="50" r="5" fill="#fbbf24"/>
    <line x1="30" y1="60" x2="30" y2="75" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Right icon - Alert -->
  <g transform="translate(950, 250)">
    <path d="M 30 5 L 55 50 L 5 50 Z" fill="none" stroke="#ef4444" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="30" cy="65" r="4" fill="#ef4444"/>
    <line x1="30" y1="40" x2="30" y2="55" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Top text -->
  <text x="600" y="580" font-size="36" font-weight="bold" text-anchor="middle" fill="#4ade80">
    Personal Safety
  </text>
  
  <!-- Bottom text -->
  <text x="600" y="615" font-size="20" text-anchor="middle" fill="#d1d5db">
    Protect yourself with awareness and good judgment
  </text>
</svg>