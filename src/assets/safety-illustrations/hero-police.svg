<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a7b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Police Badge (6-pointed star) -->
  <g transform="translate(600, 180)">
    <!-- Outer star points -->
    <path d="M 0,-90 L 20,-40 L 70,-50 L 35,0 L 60,50 L 10,30 L 0,85 L -10,30 L -60,50 L -35,0 L -70,-50 L -20,-40 Z" 
          fill="#3b82f6" opacity="0.8" stroke="#1e40af" stroke-width="2"/>
    <!-- Circle in center -->
    <circle cx="0" cy="0" r="35" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
    <!-- Badge text -->
    <text x="0" y="8" font-size="20" font-weight="bold" text-anchor="middle" fill="#3b82f6">POLICE</text>
  </g>
  
  <!-- Police Car (left side) -->
  <g transform="translate(250, 320)">
    <!-- Body -->
    <rect x="0" y="30" width="100" height="45" fill="#3b82f6" stroke="#1e40af" stroke-width="2" rx="5"/>
    <!-- Cabin -->
    <rect x="20" y="10" width="60" height="25" fill="#60a5fa" stroke="#1e40af" stroke-width="2" rx="3"/>
    <!-- Windows -->
    <rect x="25" y="15" width="15" height="15" fill="#dbeafe" stroke="#1e40af" stroke-width="1" rx="2"/>
    <rect x="45" y="15" width="15" height="15" fill="#dbeafe" stroke="#1e40af" stroke-width="1" rx="2"/>
    <!-- Front bumper -->
    <rect x="0" y="25" width="100" height="5" fill="#1e40af"/>
    <!-- Wheels -->
    <circle cx="25" cy="80" r="10" fill="#374151" stroke="#1f2937" stroke-width="2"/>
    <circle cx="75" cy="80" r="10" fill="#374151" stroke="#1f2937" stroke-width="2"/>
    <!-- Light bar (roof) -->
    <rect x="5" y="5" width="90" height="6" fill="#ef4444" rx="2"/>
  </g>
  
  <!-- Handcuffs (right side) -->
  <g transform="translate(950, 320)">
    <!-- Left cuff -->
    <circle cx="15" cy="25" r="12" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <!-- Right cuff -->
    <circle cx="65" cy="25" r="12" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <!-- Chain connecting -->
    <line x1="27" y1="25" x2="53" y2="25" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <!-- Inner details -->
    <line x1="10" y1="25" x2="20" y2="25" stroke="#3b82f6" stroke-width="2"/>
    <line x1="60" y1="25" x2="70" y2="25" stroke="#3b82f6" stroke-width="2"/>
  </g>
  
  <!-- Top text (bigger) -->
  <text x="600" y="560" font-size="48" font-weight="bold" text-anchor="middle" fill="#3b82f6">
    Police Encounters
  </text>
  
  <!-- Bottom text (bigger) -->
  <text x="600" y="610" font-size="24" text-anchor="middle" fill="#d1d5db">
    Know your rights when interacting with law enforcement
  </text>
</svg>