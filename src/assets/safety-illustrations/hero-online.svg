<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient2)"/>
  
  <!-- Screen/Monitor -->
  <rect x="350" y="150" width="500" height="350" fill="#374151" stroke="#60a5fa" stroke-width="3" rx="10"/>
  <rect x="360" y="160" width="480" height="310" fill="#1f2937"/>
  
  <!-- Phishing indicator -->
  <circle cx="600" cy="200" r="45" fill="none" stroke="#ef4444" stroke-width="3"/>
  <line x1="575" y1="175" x2="625" y2="225" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="625" y1="175" x2="575" y2="225" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Lock icon (security) -->
  <g transform="translate(600, 300)">
    <rect x="-25" y="0" width="50" height="40" rx="3" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M -15 0 Q -15 -15 0 -15 Q 15 -15 15 0" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="3" fill="#10b981"/>
  </g>
  
  <!-- Keyboard -->
  <rect x="400" y="510" width="400" height="60" fill="#374151" stroke="#60a5fa" stroke-width="2" rx="5"/>
  <circle cx="450" cy="535" r="5" fill="#60a5fa" opacity="0.6"/>
  <circle cx="550" cy="535" r="5" fill="#60a5fa" opacity="0.6"/>
  <circle cx="650" cy="535" r="5" fill="#60a5fa" opacity="0.6"/>
  <circle cx="750" cy="535" r="5" fill="#60a5fa" opacity="0.6"/>
  
  <!-- Text -->
  <text x="600" y="580" font-size="36" font-weight="bold" text-anchor="middle" fill="#60a5fa">
    Online Safety
  </text>
  
  <text x="600" y="615" font-size="20" text-anchor="middle" fill="#d1d5db">
    Protect yourself from phishing, malware, and fraud
  </text>
</svg>