<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sysadmin Toolkit Hero</title>
  <desc id="desc">Abstract sysadmin dashboard scene with network nodes, graphs, and monitoring panels.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#123B4A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17384A"/>
      <stop offset="1" stop-color="#21556B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1C5"/>
      <stop offset="1" stop-color="#F6AD55"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1050" cy="90" r="160" fill="#3A8D99" opacity="0.15"/>
  <circle cx="150" cy="560" r="220" fill="#4FD1C5" opacity="0.08"/>

  <rect x="90" y="90" width="1020" height="450" rx="28" fill="#0F2A3B" stroke="#2E5D73"/>

  <rect x="130" y="130" width="370" height="180" rx="18" fill="url(#card)"/>
  <rect x="530" y="130" width="290" height="180" rx="18" fill="url(#card)"/>
  <rect x="850" y="130" width="220" height="180" rx="18" fill="url(#card)"/>

  <rect x="130" y="340" width="620" height="160" rx="18" fill="url(#card)"/>
  <rect x="780" y="340" width="290" height="160" rx="18" fill="url(#card)"/>

  <path d="M160 260 L220 220 L275 236 L338 192 L392 214 L455 170" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <circle cx="220" cy="220" r="8" fill="#4FD1C5"/>
  <circle cx="338" cy="192" r="8" fill="#4FD1C5"/>
  <circle cx="455" cy="170" r="8" fill="#F6AD55"/>

  <circle cx="612" cy="195" r="50" stroke="#4FD1C5" stroke-width="8" opacity="0.9"/>
  <path d="M612 165 V195 L634 208" stroke="#F6AD55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="878" y="165" width="164" height="20" rx="10" fill="#2E5D73"/>
  <rect x="878" y="200" width="120" height="20" rx="10" fill="#4FD1C5"/>
  <rect x="878" y="235" width="145" height="20" rx="10" fill="#F6AD55"/>

  <path d="M170 450 H710" stroke="#2E5D73" stroke-width="8" stroke-linecap="round"/>
  <path d="M170 420 H660" stroke="#2E5D73" stroke-width="8" stroke-linecap="round"/>
  <path d="M170 390 H520" stroke="#2E5D73" stroke-width="8" stroke-linecap="round"/>

  <g opacity="0.95">
    <circle cx="840" cy="410" r="12" fill="#4FD1C5"/>
    <circle cx="950" cy="390" r="12" fill="#4FD1C5"/>
    <circle cx="1020" cy="440" r="12" fill="#4FD1C5"/>
    <circle cx="930" cy="470" r="12" fill="#4FD1C5"/>
    <path d="M840 410 L950 390 L1020 440 L930 470 L840 410" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="140" y="582" fill="#D7F4F0" font-size="38" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    Sysadmin Toolkit
  </text>
</svg>
